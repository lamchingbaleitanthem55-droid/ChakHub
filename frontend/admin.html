<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zestly Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="offline" class="offline hidden"><i class="fa-solid fa-wifi"></i> You're offline. Reconnect to continue.</div>
<aside class="side">
  <div class="brand"><i class="fa-solid fa-bowl-food"></i> Zestly <small>Admin</small></div>
  <nav id="nav">
    <a href="#/" data-r="dashboard"><i class="fa-solid fa-chart-line"></i>Dashboard</a>
    <a href="#/restaurants" data-r="restaurants"><i class="fa-solid fa-store"></i>Restaurants</a>
    <a href="#/foods" data-r="foods"><i class="fa-solid fa-burger"></i>Foods</a>
    <a href="#/orders" data-r="orders"><i class="fa-solid fa-receipt"></i>Orders<span class="nb hidden" id="nb"></span></a>
    <a href="#/customers" data-r="customers"><i class="fa-solid fa-users"></i>Customers</a>
    <a href="#/complaints" data-r="complaints"><i class="fa-solid fa-headset"></i>Complaints</a>
    <a href="#/partners" data-r="partners"><i class="fa-solid fa-motorcycle"></i>Delivery Partners</a>
    <a href="#/zones" data-r="zones"><i class="fa-solid fa-map-location-dot"></i>Zones</a>
    <a href="#/earnings" data-r="earnings"><i class="fa-solid fa-indian-rupee-sign"></i>Earnings</a>
    <a href="#/coupons" data-r="coupons"><i class="fa-solid fa-ticket"></i>Coupons</a>
    <a href="#/settings" data-r="settings"><i class="fa-solid fa-gear"></i>Settings</a>
  </nav>
  <button class="btn ghost" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
</aside>
<main id="view" class="main"></main>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
